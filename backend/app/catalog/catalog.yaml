# Phrases that indicate NON-cyber "security" or unrelated work. A tender whose title/text
# matches an exclusion and has no DIRECT/SEMANTIC capability match is rejected deterministically.
exclusions:
  - {p: 'security (guards?|personnel|staff|manpower)', reason: Physical security manpower}
  - {p: 'watch (and|&) ward', reason: Physical security manpower}
  - {p: 'ex[- ]servicem[ae]n', reason: Physical security manpower}
  - {p: 'CCTV( cameras?| surveillance| system)?', reason: Physical surveillance (CCTV)}
  - {p: 'surveillance cameras?', reason: Physical surveillance}
  - {p: 'fire (safety|fighting|alarm|detection)', reason: Fire safety}
  - {p: 'access control (system|door)s?|boom barriers?|baggage scanner|metal detector', reason: Physical access control}
  - {p: 'construction|civil works?|repair(s)? (and|&) maintenance of (building|road)|road works?|building works?', reason: Civil / construction works}
  - {p: 'electrical works?|electrification|transformer|substation|transmission line', reason: Electrical works}
  - {p: 'plumbing|painting|waterproofing|horticulture|housekeeping|cleaning services?|catering|canteen', reason: Facility services}
  - {p: 'supply of (furniture|stationery|uniforms?|medicines?|vehicles?)', reason: Unrelated supply}
  - {p: 'hiring of (vehicles?|taxis?|cars?|buses)', reason: Vehicle hiring}
  - {p: 'security deposit', reason: Financial term (security deposit), not cyber}
  - {p: 'food security|social security|national security guard', reason: Non-cyber use of "security"}
  - {p: 'cyber ?knife', reason: Medical device (CyberKnife radiosurgery)}
  - {p: 'defect liability period', reason: Contract term (DLP = defect liability period)}

# Generic security wording — insufficient on its own (section 15). Routes to LLM / review, never auto-accepts.
generic_signals:
  - 'cyber ?security'
  - 'information security'
  - 'IT security'
  - 'security audit'
  - 'data security'
  - 'network security'
  - 'security solutions?'
  - 'security (software|tools?)'
  - 'cyber'
  - 'quantum[- ]?secure|post[- ]quantum|secure (IT|network|communications?) infrastructure'

# ---------------------------------------------------------------------------------------------------
# Semantic matching (Phase 4)
#
# descriptions: plain-language description of what the buyer is procuring, used as embedding anchors
#   alongside each capability's name and sub-capabilities. Written from the buyer's point of view.
# competitors: OEMs the company does NOT sell, by capability. A tender naming one still states a
#   functional requirement for that capability (often "or equivalent"), and is a bid risk.
# negative_anchors: frequent non-cyber procurements that share vocabulary with cyber tenders. A tender
#   semantically closer to one of these than to any capability is not a semantic match.
# ---------------------------------------------------------------------------------------------------
descriptions:
  svc_appsec: Security testing and audit of web applications, mobile apps and APIs to find exploitable vulnerabilities before or after go-live
  svc_netsec: Vulnerability assessment, scanning and ethical hacking of networks, servers, firewalls and IT infrastructure
  svc_redteam: Simulated real-world cyber attacks by an offensive team against people, processes and technology to test detection and response
  svc_cyber_drill: Organising cyber security drills and exercises for departments to test their response to simulated attacks
  svc_cloud_assessment: Security review and configuration audit of public cloud accounts such as AWS, Azure and Google Cloud
  svc_container_security: Security review and hardening of Kubernetes clusters, Docker containers and container images
  cmp_iso27001: Consulting and audit support to implement an information security management system and obtain ISO 27001 certification
  cmp_pci_dss: PCI DSS assessment by a qualified security assessor for systems that store, process or transmit payment card data
  cmp_cyber_risk: Cyber security audit and risk assessment of an organisation by a CERT-In empanelled auditor, including gap and maturity assessment
  cmp_data_localization: Audit of compliance with regulations requiring payment and personal data to be stored in India
  cmp_regulatory_audit: Information systems and cyber security audit against RBI, IRDAI, SEBI, NHB, NABARD or UIDAI Aadhaar guidelines
  con_digital_transformation: Security-focused advisory for digital transformation and modernisation programmes
  con_devsecops: Embedding security tools and practices into software development pipelines (CI/CD), secure SDLC consulting
  con_cloud_arch_review: Independent review of cloud and security architecture designs
  con_security_framework: Drafting cyber security policies, procedures and frameworks; CISO advisory services
  ir_breach_response: Investigating and containing cyber attacks, ransomware and data breaches; incident response retainer
  ir_crisis_management: Preparing a cyber crisis management plan to respond to cyber attacks, as required by CERT-In
  ir_tabletop: Discussion-based cyber attack scenario exercise for management and response teams
  ir_readiness_compromise: Hunting for hidden attackers and indicators of compromise; assessing incident response readiness
  ir_capacity_building: Building incident response teams (CSIRT or CERT) and training staff in cyber security and awareness
  df_acquisition: Forensically sound acquisition and imaging of computers, phones and storage media
  df_analysis: Forensic examination of seized digital devices and evidence, with expert reports for investigation or court
  df_data_recovery: Recovery and reconstruction of deleted or damaged digital data for investigations
  df_lab_setup: Setting up or upgrading a cyber forensic or cyber crime investigation laboratory
  df_eee_79a: Helping a forensic lab get notified as Examiner of Electronic Evidence under Section 79A of the IT Act
  df_training: Training investigators and police officers in digital forensics and electronic evidence handling
  mss_mdr: 24x7 security monitoring, threat detection and response by a security operations centre (SOC) service
  mss_infra_mgmt: Operating and managing security devices such as firewalls, IPS, proxies and security tools
  mss_cloud: Managed security services protecting workloads and accounts on public cloud
  mss_appsec: Managed, continuous application security testing as a service
  mss_network: Managed firewall and network security operations
  prd_audit_lifecycle: Software to manage the lifecycle of audits, observations and compliance tracking
  prd_firewall_orchestration: Software to automate firewall rule review, change management and policy compliance across many firewalls
  prd_dlp: Software that prevents sensitive data leaking through email, USB, web upload, cloud and endpoints
  prd_xdr: Endpoint detection and response or extended detection and response software protecting desktops and servers from malware and attacks
  prd_pam: Software to control, vault and record privileged administrator access to servers, databases and network devices
  prd_iam: Identity and access management, single sign-on, multi-factor authentication and identity governance software
  prd_vuln_mgmt: Software that continuously scans assets for vulnerabilities and prioritises remediation
  prd_pentest_tools: Commercial penetration testing and adversary simulation software tools
  prd_bas: Platform that continuously simulates attacker techniques to validate that security controls work
  prd_cspm: Software detecting misconfigurations and risks across cloud accounts and cloud workloads
  prd_mobile_security: Software protecting smartphones and tablets from malicious apps, phishing and device threats
  prd_siem: Platform that collects logs from servers, network and security devices, correlates events and raises security alerts
  prd_appsec_tools: Software that scans application source code or running web applications for security flaws
  prd_dfir_software: Digital forensics software for extracting and analysing data from computers, phones, video, email and social media
  prd_dfir_hardware: Forensic hardware such as write blockers, disk duplicators, forensic workstations, Faraday bags and mobile extraction kits
  prd_threat_intel: Cyber threat intelligence feeds and platforms, including dark web and open-source intelligence
  prd_brand_monitoring: Monitoring and takedown of fake websites, apps and social media accounts impersonating an organisation
  prd_ot_security: Security monitoring and protection for SCADA, industrial control systems and operational technology networks
  prd_sase: Cloud-delivered secure network access for branches and remote users, secure SD-WAN and zero trust access

