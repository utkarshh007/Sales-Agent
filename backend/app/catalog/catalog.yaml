# COMPANY CAPABILITY CATALOG — SOURCE OF TRUTH
#
# capabilities: what the company can deliver. `offering` is SERVICE or PRODUCT.
#   synonyms: lexicon rules used by the deterministic matcher (and shown to the LLM).
#     p   = regex (case-insensitive unless cs: true); word boundaries are added automatically
#     t   = D (direct), S (semantic/functional), A (adjacent)
#     sub = sub-capability label reported in the match explanation
# products: OEM products the company supports, linked to functional capabilities.
#   aliases are explicit brand/product mentions (always a DIRECT OEM match).
# exclusions: phrases that indicate the tender is NOT cyber (physical security, civil works...).
# generic_signals: wording that hints at security but is insufficient on its own (section 15).

version: 1

categories:
  A: Assessment Services
  B: Compliance Management
  C: Consulting
  D: Incident Response
  E: Digital Forensics
  F: Managed Security Services
  G: Security Management / Products
  H: Content Security / XDR
  I: Identity Management / PAM
  J: Vulnerability Management & Penetration Testing
  K: Breach & Attack Simulation
  L: Cloud Security
  M: Mobile Security
  N: SIEM / Security Analytics
  O: Application Security Products
  P: DFIR Software / Capabilities
  Q: DFIR Hardware
  R: Threat Intelligence & Brand Monitoring
  S: OT Security
  T: SASE / Network Security

